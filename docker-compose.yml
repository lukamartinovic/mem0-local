services:
  # ── Single container: Qdrant (supervisor-started) + MCP server ────────────
  # No Ollama anywhere: fact inference is the calling agent's job.
  mem0-local:
    build: .
    container_name: mem0-local
    ports:
      - "8765:8765"   # MCP server + web UI
      - "6333:6333"   # Qdrant (same container)
    environment:
      MEM0_TELEMETRY: "False"
      MEM0_QDRANT_HOST: 127.0.0.1
      MEM0_QDRANT_PORT: "6333"
      MEM0_EMBED_MODEL: ${MEM0_EMBED_MODEL:-nomic-ai/nomic-embed-text-v1.5}
      MEM0_EMBED_DIMS: "${MEM0_EMBED_DIMS:-768}"
      MEM0_CHUNK_CHARS: "${MEM0_CHUNK_CHARS:-3000}"
      MEM0_DEFAULT_USER_ID: ${MEM0_DEFAULT_USER_ID:-dev}
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request,json; d=json.loads(urllib.request.urlopen('http://localhost:8765/health',timeout=10).read()); exit(0 if d.get('status')=='ok' else 1)"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 180s

volumes:
  qdrant_data: